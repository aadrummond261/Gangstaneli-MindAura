services:
  - type: web
    name: gangstaneli-mindaura-api
    runtime: docker
    rootDir: Gangstaneli-MindAura/Backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SQLITE_DATABASE_URL
        value: jdbc:sqlite:/tmp/mindaura.db
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: gangstaneli-mindaura
    runtime: static
    rootDir: Gangstaneli-MindAura
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gangstaneli-mindaura-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
